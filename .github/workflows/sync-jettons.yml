name: Sync TON Jettons

on:
  workflow_dispatch:  # Allow manual trigger
  schedule:
    # Run once a day at 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  sync-jettons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run sync script
        run: |
          python sync_jettons.py
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update jettons data"
          branch: staging/jettons-sync
          delete-branch: true
          title: "Update TON Jettons Data"
          body: |
            ## Automated Jettons Sync
            
            This PR updates the `jettons.json` file with the latest data from the [ton-assets](https://github.com/tonkeeper/ton-assets) repository.
            
            **Changes:**
            - Synced jetton metadata from upstream
            - Converted YAML files to JSON format
            
            **Triggered by:** ${{ github.event_name == 'schedule' && 'Scheduled daily sync' || 'Manual workflow dispatch' }}
            
            Please review and merge if everything looks correct.
          labels: |
            automated
            data-sync
